packages:
  - apps/*
  - packages/*
allowBuilds:
  "@nubjs/nub": true
  core-js: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
patchedDependencies:
  next: patches/next.patch
  railway: patches/railway.patch

overrides:
  "esbuild@<0.28.1": "^0.28.1"
  "postcss@<8.5.10": "^8.5.19"
  vite@*: "catalog:"
  vitest@*: "catalog:"
onlyBuiltDependencies:
  - "@nubjs/nub"
  - better-sqlite3
  - core-js
  - esbuild
  - msw
  - sharp
  - unrs-resolver
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/coverage-v8": 5.0.5
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
