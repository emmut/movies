packages:
  - apps/*
  - packages/*
# Vite+ owns runtime and package-manager provisioning.
runtimeOnFail: ignore
pmOnFail: ignore
# Keep the one-day delay; explicitly allow the selected latest releases below.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - next@16.4.3
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - '@next/env@16.4.3'
  - '@primer/octicons-react@19.42.0'
  - posthog-js@1.438.21
  - posthog-node@5.57.1
  - '@posthog/browser-common@0.9.11'
  - '@posthog/core@1.60.1'
  - vite-plus@1.4.0
  - '@voidzero-dev/vite-plus-core@1.4.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.4.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.4.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.4.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.4.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.4.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.4.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.4.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.4.0'
allowBuilds:
  core-js: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
patchedDependencies:
  railway@3.16.0: patches/railway.patch

overrides:
  "esbuild@<0.28.1": "^0.28.1"
  "postcss@<8.5.10": "^8.5.19"
  vite@*: "catalog:"
  vitest@*: "catalog:"
onlyBuiltDependencies:
  - better-sqlite3
  - core-js
  - esbuild
  - msw
  - sharp
  - unrs-resolver
catalog:
  "@better-auth/expo": 1.7.12
  "@orpc/client": ^1.15.0
  "@orpc/server": ^1.15.0
  "@playwright/test": ^1.64.1
  "@types/pg": ^8.23.1
  "server-only": ^0.0.1
  "varlock": 1.18.0
  "@base-ui/react": ^1.9.0
  "@better-auth/passkey": ^1.7.12
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/sortable": ^10.0.0
  "@dnd-kit/utilities": ^3.2.2
  "@imgproxy/imgproxy-js-core": ^1.9.0
  "@imgproxy/imgproxy-node": ^1.1.0
  "@primer/octicons-react": ^19.42.0
  "@t3-oss/env-nextjs": ^0.13.11
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/react-query": ^5.104.5
  "@types/node": ^26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "babel-plugin-react-compiler": 1.0.0
  "better-auth": ^1.7.12
  "class-variance-authority": ^0.7.1
  "cn": ^0.5.0
  "drizzle-orm": ^0.45.4
  "lucide-react": ^1.61.0
  "next": 16.4.3
  "nuqs": ^2.10.2
  "pg": ^8.23.1
  "postcss": 8.5.31
  "posthog-js": ^1.438.21
  "posthog-node": ^5.57.1
  "react": 19.3.1
  "react-dom": 19.3.1
  "sonner": ^2.0.8
  "tailwindcss": 4.3.3
  "tailwindcss-animate": ^1.0.7
  "typescript": 7.0.2
  "zod": ^4.6.7
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/coverage-v8": 5.0.5
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
