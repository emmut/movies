packages:
  - apps/*
  - packages/*
# Vite+ owns runtime and package-manager provisioning.
runtimeOnFail: ignore
pmOnFail: ignore
# Preserve the existing one-day delay. This migration explicitly selects 1.4.0,
# which was published today; keep the exception scoped to that exact release.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vite-plus@1.4.0
  - '@voidzero-dev/vite-plus-core@1.4.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.4.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.4.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.4.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.4.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.4.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.4.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.4.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.4.0'
allowBuilds:
  core-js: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
patchedDependencies:
  next: patches/next.patch
  railway: patches/railway.patch

overrides:
  "esbuild@<0.28.1": "^0.28.1"
  "postcss@<8.5.10": "^8.5.19"
  vite@*: "catalog:"
  vitest@*: "catalog:"
onlyBuiltDependencies:
  - better-sqlite3
  - core-js
  - esbuild
  - msw
  - sharp
  - unrs-resolver
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/coverage-v8": 5.0.5
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
