name: Railway production infra

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-prod:
    name: Apply infra to production
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_IAC_BRANCH: main
      RAILWAY_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v7

      - name: Setup Vite+, Node and pnpm
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.74.1

      - name: Plan and guard production infrastructure
        run: |
          railway link --project movies --environment "$RAILWAY_ENVIRONMENT"
          railway config plan --out "$RUNNER_TEMP/railway-production-plan.json"
          ./node_modules/.bin/vpx scripts/check-infra-plan.ts "$RUNNER_TEMP/railway-production-plan.json"

      - name: Apply approved production plan
        run: railway config apply --plan "$RUNNER_TEMP/railway-production-plan.json" --yes --confirm-destructive

      - name: Remove saved plan
        if: always()
        run: rm -f "$RUNNER_TEMP/railway-production-plan.json"

      - name: Ensure API domain
        run: .github/scripts/ensure-service-domain.sh api
