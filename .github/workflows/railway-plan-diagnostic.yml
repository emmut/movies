name: Railway plan schema diagnostic
on:
  pull_request:
jobs:
  inspect-plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_IAC_BRANCH: main
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: npm i -g @railway/cli@5.74.1
      - name: Inspect production plan without applying
        run: |
          railway --version
          railway link --project movies --environment production
          railway config plan --out "$RUNNER_TEMP/diagnostic-plan.json"
          ./node_modules/.bin/vpx scripts/check-infra-plan.ts "$RUNNER_TEMP/diagnostic-plan.json"
      - if: always()
        run: rm -f "$RUNNER_TEMP/diagnostic-plan.json"
