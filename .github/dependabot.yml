# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"

  # Workflow action refs. Without this, `uses:` majors are never proposed and go
  # stale silently until something breaks — which is exactly how the Fallow
  # action sat on @v2 until the CLI it installs dropped the extra binaries its
  # bundled verifier still expected. Keeping the refs moving makes a required
  # wrapper bump show up as a PR instead of a red CI run.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
